[package]
name = "voice-input"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[[bin]]
name = "voice-input"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
fs2 = "0.4"
futures-util = "0.3"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
core-foundation = "0.10"
core-graphics = "0.24"
cpal = "0.16"
global-hotkey = "0.7"
macos-accessibility-client = "0.0.2"
libc = "0.2"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSSound", "NSWorkspace", "libc"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSString"] }
rubato = { version = "0.16.2", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
signal-hook = "0.3"
whisper-rs = { version = "0.15.1", features = ["metal", "tracing_backend"] }

[dev-dependencies]
tempfile = "3"
